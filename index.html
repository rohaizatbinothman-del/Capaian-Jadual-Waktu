<style>
  :root{--biru:#1a4ba8;--biru2:#1f5bd6;--latar1:#2f6fe0;--latar2:#5a9bff;--merah:#d3122b;--kuning:#ffd400}
  *{box-sizing:border-box}
  html{min-height:100%;background:var(--latar1)}
  body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#0f172a;
    background:linear-gradient(180deg,var(--latar1) 0%,var(--latar2) 55%,var(--latar1) 100%) fixed}
  body:before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--merah) 0 50%,var(--kuning) 50% 100%)}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 32px}
  header{text-align:center;color:#fff;padding:8px 0 16px}
  header img{width:110px;height:110px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
  h1{font-size:18px;margin:8px 0 2px;letter-spacing:.5px}
  .sub{font-size:22px;color:var(--kuning);font-weight:bold;letter-spacing:1px}
  .card{background:#fff;border-radius:14px;padding:16px;border-top:4px solid var(--merah);box-shadow:0 6px 18px rgba(0,0,0,.3)}
  label{display:block;font-size:14px;font-weight:bold;margin:12px 0 4px;color:var(--biru)}
  select{width:100%;padding:12px;font-size:16px;border:2px solid #cbd5e1;border-radius:8px;background:#fff}
  select:focus{outline:none;border-color:var(--biru2)}
  .edisi{margin-top:16px;border-top:1px solid #e2e8f0;padding-top:12px}
  .edisi b{display:block;margin-bottom:8px;color:var(--biru)}
  .btns{display:flex;gap:8px}
  .btns a{flex:1;text-align:center;padding:12px;border-radius:8px;text-decoration:none;font-size:15px;font-weight:bold}
  .papar{background:var(--biru2);color:#fff}
  .muat{background:var(--kuning);color:#12337a}
  #msg{margin-top:12px;font-size:14px}
  .err{color:#b91c1c;background:#fee2e2;padding:10px;border-radius:8px}
  .info{color:#475569}
  footer{text-align:center;color:#cbd5e1;font-size:12px;margin-top:16px}
</style>
</head>

    <h1>Portal Capaian</h1>
    <div class="sub">Jadual Waktu SKTR2</div>
  </header>
  <div class="card">
    <label for="tahun">Tahun</label>
    <select id="tahun" disabled><option>Memuatkan...</option></select>
    <label for="kat">Kategori</label>
    <select id="kat" disabled></select>
    <label for="nama">Nama</label>
    <select id="nama" disabled></select>
    <div id="msg"></div>
    <div id="hasil"></div>
  </div>
  <footer>SKTR2</footer>
</div>

<script>
// >>> TAMPAL PAUTAN /exec ANDA DI SINI <<<
const API = "https://script.google.com/macros/s/AKfycbxbs0QR24TZvWe7k9r-rcu1gCVNTTVI3ZlqkCJTj6Nb_lGYPpVbly7lE1MKIEeYMx47IQ/exec";

let DATA = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function msg(t, err){ $("msg").innerHTML = t ? '<div class="'+(err?'err':'info')+'">'+t+'</div>' : ""; }

async function api(params){
  const r = await fetch(API + "?" + new URLSearchParams(params));
  const j = await r.json();
  if (j && j.error) throw new Error(j.error);
  return j;
}
function fail(){ msg("Gagal memuatkan data. Semak internet dan muat semula halaman.", true); }
function fill(sel, arr, ph){
  sel.innerHTML = '<option value="">' + ph + '</option>' + arr.map(v => '<option>' + esc(v) + '</option>').join("");
  sel.disabled = false;
}

api({action:"tahun"}).then(list => { fill($("tahun"), list, "-- Pilih tahun --"); msg(""); }).catch(fail);

$("tahun").onchange = async () => {
  $("hasil").innerHTML = ""; $("kat").disabled = $("nama").disabled = true;
  if(!$("tahun").value) return;
  msg("Memuatkan...");
  try{
    DATA = await api({action:"data", tahun:$("tahun").value});
    msg("");
    fill($("kat"), Object.keys(DATA.map), "-- Pilih kategori --");
    $("nama").innerHTML = ""; $("nama").disabled = true;
  }catch(e){ fail(); }
};

$("kat").onchange = () => {
  $("hasil").innerHTML = "";
  if(!$("kat").value) return;
  fill($("nama"), DATA.map[$("kat").value], "-- Pilih nama --");
};

$("nama").onchange = async () => {
  $("hasil").innerHTML = "";
  if(!$("nama").value) return;
  msg("Mencari jadual...");
  try{
    const r = await api({action:"jadual", tahun:$("tahun").value, k:$("kat").value, n:$("nama").value});
    if(!r){ msg("Jadual tidak dijumpai.", true); return; }
    msg("");
    let h = "";
    r.edisi.forEach((e, i) => {
      if(!e) return;
      h += '<div class="edisi"><b>' + esc(DATA.labels[i]) + '</b>';
      if(e.teks) h += '<div class="info">' + esc(e.teks) + '</div>';
      else h += '<div class="btns">' +
        '<a class="papar" target="_blank" rel="noopener" href="'+e.papar+'" onclick="stat('+i+',\'papar\')">Papar</a>' +
        '<a class="muat" href="'+e.muat+'" data-id="'+e.id+'" onclick="muat(event,'+i+')">Muat Turun</a></div>';
      h += '</div>';
    });
    $("hasil").innerHTML = h || '<div class="info">Tiada jadual untuk dipaparkan.</div>';
  }catch(e){ fail(); }
};

async function muat(ev, i){
  ev.preventDefault();
  const a = ev.currentTarget;
  if(a.dataset.busy) return;
  a.dataset.busy = 1;
  const asal = a.textContent;
  a.textContent = "Memuat turun...";
  stat(i, "download");
  try{
    const r = await api({action:"pdf", tahun:$("tahun").value, id:a.dataset.id});
    const bin = atob(r.data), bytes = new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++) bytes[k] = bin.charCodeAt(k);
    const url = URL.createObjectURL(new Blob([bytes], {type:"application/pdf"}));
    const l = document.createElement("a");
    l.href = url; l.download = r.name;
    document.body.appendChild(l); l.click(); l.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    a.textContent = "Selesai \u2713";
  }catch(e){
    window.open(a.href, "_blank");   // jalan alternatif jika gagal
    a.textContent = asal;
  }
  setTimeout(()=>{ a.textContent = asal; delete a.dataset.busy; }, 3000);
}

function stat(i, type){
  try{
    fetch(API + "?" + new URLSearchParams({action:"log", tahun:$("tahun").value, k:$("kat").value,
      n:$("nama").value, edisi:DATA.labels[i], type:type}), {mode:"no-cors", keepalive:true});
  }catch(e){}
}
</script>
</body>
